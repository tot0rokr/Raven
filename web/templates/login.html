{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>로그인 · Raven</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="wordmark">raven<span class="wordmark-dot" aria-hidden="true"></span></div>
    <div class="login-heading">
      <p class="eyebrow">PERSONAL WORKSPACE</p>
      <h1>내 작업 공간으로</h1>
      <p class="muted">Raven 계정으로 로그인하세요.</p>
    </div>
    {% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login/" class="stack-form">
      {% csrf_token %}
      <label for="username">아이디</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="150" required autofocus>
      <label for="password">패스워드</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
      <button class="button-primary login-submit" type="submit">로그인</button>
    </form>
    <p class="login-note">세션과 데스크톱은 로그인 후 접근할 수 있습니다.</p>
  </main>
</body>
</html>
